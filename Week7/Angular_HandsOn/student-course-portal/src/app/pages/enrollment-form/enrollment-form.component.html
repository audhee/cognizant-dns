<div class="form-container">
  <h2>Student Course Enrollment (Template-Driven Form)</h2>

  <!-- Task 46: Success message -->
  <div *ngIf="submitted" class="success-alert">
    Enrollment request submitted successfully!
  </div>

  <!-- Task 39: Template-driven form with #enrollForm='ngForm' -->
  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
    <!-- Student Name -->
    <div class="form-group">
      <label for="studentName">Student Name *</label>
      <input
        type="text"
        id="studentName"
        name="studentName"
        class="form-control"
        [(ngModel)]="studentName"
        #nameCtrl="ngModel"
        required
        minlength="3"
      />
      <!-- Task 44: Validation messages -->
      <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']" class="error-msg">
        Name is required.
      </span>
      <span *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']" class="error-msg">
        Name must be at least 3 characters long.
      </span>
    </div>

    <!-- Student Email -->
    <div class="form-group">
      <label for="studentEmail">Student Email *</label>
      <input
        type="email"
        id="studentEmail"
        name="studentEmail"
        class="form-control"
        [(ngModel)]="studentEmail"
        #emailCtrl="ngModel"
        required
        email
      />
      <span *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']" class="error-msg">
        Email is required.
      </span>
      <span *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']" class="error-msg">
        Please enter a valid email address.
      </span>
    </div>

    <!-- Course ID -->
    <div class="form-group">
      <label for="courseId">Course ID *</label>
      <input
        type="number"
        id="courseId"
        name="courseId"
        class="form-control"
        [(ngModel)]="courseId"
        #courseCtrl="ngModel"
        required
      />
      <span *ngIf="courseCtrl.touched && courseCtrl.errors?.['required']" class="error-msg">
        Course ID is required.
      </span>
    </div>

    <!-- Preferred Semester -->
    <div class="form-group">
      <label for="preferredSemester">Preferred Semester</label>
      <select
        id="preferredSemester"
        name="preferredSemester"
        class="form-control"
        [(ngModel)]="preferredSemester"
      >
        <option value="Odd">Odd Semester</option>
        <option value="Even">Even Semester</option>
      </select>
    </div>

    <!-- Agree to Terms Checkbox -->
    <div class="form-group checkbox-group">
      <input
        type="checkbox"
        id="agreeToTerms"
        name="agreeToTerms"
        [(ngModel)]="agreeToTerms"
        #termsCtrl="ngModel"
        required
      />
      <label for="agreeToTerms">I agree to the enrollment terms & conditions *</label>
      <span *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']" class="error-msg block-error">
        You must agree to terms.
      </span>
    </div>

    <!-- Buttons -->
    <div class="btn-group">
      <!-- Task 41: Submit button disabled state -->
      <button type="submit" class="btn btn-primary" [disabled]="enrollForm.invalid">
        Submit
      </button>
      <!-- Task 47: Reset button -->
      <button type="button" class="btn btn-secondary" (click)="onReset(enrollForm)">
        Reset
      </button>
    </div>
  </form>
</div>
