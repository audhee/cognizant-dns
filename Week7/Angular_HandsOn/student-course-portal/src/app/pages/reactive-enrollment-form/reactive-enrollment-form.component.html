<div class="form-container">
  <h2>Student Course Enrollment (Reactive Form)</h2>

  <div *ngIf="submitted" class="success-alert">
    Reactive enrollment form submitted successfully!
  </div>

  <form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">
    <!-- Student Name -->
    <div class="form-group">
      <label for="studentName">Student Name *</label>
      <input
        type="text"
        id="studentName"
        formControlName="studentName"
        class="form-control"
      />
      <span *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.errors?.['required']" class="error-msg">
        Name is required.
      </span>
      <span *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.errors?.['minlength']" class="error-msg">
        Name must be at least 3 characters.
      </span>
    </div>

    <!-- Student Email -->
    <div class="form-group">
      <label for="studentEmail">Student Email *</label>
      <input
        type="email"
        id="studentEmail"
        formControlName="studentEmail"
        class="form-control"
      />
      <span *ngIf="enrollForm.get('studentEmail')?.touched && enrollForm.get('studentEmail')?.errors?.['required']" class="error-msg">
        Email is required.
      </span>
      <span *ngIf="enrollForm.get('studentEmail')?.touched && enrollForm.get('studentEmail')?.errors?.['email']" class="error-msg">
        Invalid email format.
      </span>
      <!-- Task 55: Async validator error message -->
      <span *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']" class="error-msg">
        Email is already taken (simulated check).
      </span>
    </div>

    <!-- Course ID -->
    <div class="form-group">
      <label for="courseId">Course ID / Code *</label>
      <input
        type="text"
        id="courseId"
        formControlName="courseId"
        class="form-control"
      />
      <span *ngIf="enrollForm.get('courseId')?.touched && enrollForm.get('courseId')?.errors?.['required']" class="error-msg">
        Course ID is required.
      </span>
      <!-- Task 54: Custom sync validator error message -->
      <span *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']" class="error-msg">
        Course code starting with XX is not allowed.
      </span>
    </div>

    <!-- Preferred Semester -->
    <div class="form-group">
      <label for="preferredSemester">Preferred Semester</label>
      <select id="preferredSemester" formControlName="preferredSemester" class="form-control">
        <option value="Odd">Odd Semester</option>
        <option value="Even">Even Semester</option>
      </select>
    </div>

    <!-- Additional Courses FormArray -->
    <div class="form-group">
      <label>Additional Courses (Dynamic FormArray)</label>
      <div formArrayName="additionalCourses">
        <div *ngFor="let ctrl of additionalCourses.controls; let i = index" class="dynamic-row">
          <input [formControlName]="i" class="form-control" placeholder="Additional Course Name" />
          <button type="button" class="btn btn-danger btn-sm" (click)="removeCourse(i)">Remove</button>
        </div>
      </div>
      <button type="button" class="btn btn-secondary btn-sm" (click)="addCourse()">
        + Add Another Course
      </button>
    </div>

    <!-- Agree to Terms -->
    <div class="form-group checkbox-group">
      <input type="checkbox" id="agreeToTerms" formControlName="agreeToTerms" />
      <label for="agreeToTerms">I agree to the enrollment terms & conditions *</label>
    </div>

    <!-- Submit Button -->
    <div class="btn-group">
      <button type="submit" class="btn btn-primary" [disabled]="enrollForm.invalid">
        Submit
      </button>
    </div>
  </form>
</div>
