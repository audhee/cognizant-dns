<div
  class="course-card"
  [ngClass]="cardClasses"
  [ngStyle]="cardStyle"
  [appHighlight]="'#f0fdf4'"
>
  <div class="card-header">
    <h3>{{ course.name }}</h3>
    <span class="course-code">{{ course.code }}</span>
  </div>

  <div class="card-body">
    <!-- Task 36: Custom Pipe Usage -->
    <p class="credits-badge">{{ course.credits | creditLabel }}</p>

    <!-- Task 27: *ngSwitch Grade Status Badges -->
    <div [ngSwitch]="course.gradeStatus" class="status-wrapper">
      <span *ngSwitchCase="'passed'" class="badge badge-passed">Passed</span>
      <span *ngSwitchCase="'failed'" class="badge badge-failed">Failed</span>
      <span *ngSwitchDefault class="badge badge-pending">Pending</span>
    </div>
  </div>

  <div *ngIf="isExpanded" class="expanded-details">
    <p>Course ID: {{ course.id }}</p>
    <p>Full Syllabus: Standard accreditation syllabus for {{ course.name }}.</p>
  </div>

  <div class="card-footer">
    <button class="btn btn-sm btn-secondary" (click)="toggleExpand()">
      {{ isExpanded ? 'Hide Details' : 'Show Details' }}
    </button>
    <button class="btn btn-sm" [ngClass]="isEnrolled ? 'btn-danger' : 'btn-success'" (click)="onEnrollClick()">
      {{ isEnrolled ? 'Unenroll' : 'Enroll' }}
    </button>
  </div>
</div>
